    title: "Guaranteed score boost"
    body: "Buy now for a guaranteed score improvement."
    tags: ["#ad"]
    rationale: "Hard-sell promise with no real scene or reflection."
  - id: "generic-negative"
    type: negative
    audience_tags: ["learner"]
    function_tags: ["feedback"]
    style_tags: ["generic"]
    title: "Study better today"
    body: "This tool is great and everyone should use it."
    tags: ["#study"]
    rationale: "Generic claim that lacks a scene, evidence, or voice."
